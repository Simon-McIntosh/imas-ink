name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs full history

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (base + test) on Python ${{ matrix.python-version }}
        run: uv sync --python ${{ matrix.python-version }} --extra test

      - name: Ruff check
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Ruff format check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Pytest (no VTK)
        run: uv run --python ${{ matrix.python-version }} pytest -q
