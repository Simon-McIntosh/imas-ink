name: ci-3d

# Disabled until Phase 4 ships the first render-marked smoke test.
# Re-enable by uncommenting the triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  three-d-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install system VTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libxrender1 xvfb

      - name: Install project (3d + test)
        run: uv sync --extra 3d --extra test

      - name: Pytest — render-marked tests (off-screen)
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: uv run pytest -q -m render
