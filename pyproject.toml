[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "imas-ink"
dynamic = ["version"]
description = "IMAS-backed plotting and visualisation library for tokamak equilibrium data (2D + 3D) with an MCP server"
readme = "README.md"
license = { text = "ITER GIP" }
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }]
keywords = [
  "imas",
  "tokamak",
  "equilibrium",
  "visualisation",
  "plotting",
  "mcp",
  "pyvista",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "contourpy>=1.2",
  "altair>=5.3",
  "pandas>=2.2",
  "pillow>=10.0",
  "imas-python>=2.2",
  "netCDF4>=1.6",
  "h5py>=3.10",
  # Security floor constraints for transitive dependencies
  "urllib3>=2.7.0",          # CVE-2026-44432, CVE-2026-44431
  "python-multipart>=0.0.31",  # CVE-2026-42561, CVE-2026-40347
]

[project.optional-dependencies]
server = [
  "fastmcp>=2.0",
  "click>=8.1",
]
3d = [
  "pyvista>=0.43",
  "vedo>=2024.5",
  "vtk>=9.3",
  "shapely>=2.0",
  "imageio>=2.34",
  "scipy>=1.11",
]
dev = [
  "ruff>=0.6",
  "pre-commit>=3.7",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
all = [
  "imas-ink[server,3d,dev,test]",
]

[project.scripts]
imas-ink = "imas_ink.cli:main"

[project.urls]
Homepage = "https://github.com/Simon-McIntosh/imas-ink"
Repository = "https://github.com/Simon-McIntosh/imas-ink"
Issues = "https://github.com/Simon-McIntosh/imas-ink/issues"
Changelog = "https://github.com/Simon-McIntosh/imas-ink/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "imas_ink/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["imas_ink"]

[tool.hatch.build.targets.sdist]
include = [
  "/imas_ink",
  "/tests",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]
"examples/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not render'"
markers = [
  "render: requires an off-screen rendering backend (VTK)",
  "imas_data: requires IMAS fixture data (set IMAS_INK_ITER_DATA)",
]
filterwarnings = [
  "ignore::DeprecationWarning:imas.*",
]
