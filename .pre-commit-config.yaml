# Check-only hooks. NEVER re-enable --fix or write-mode formatting here.
# Multi-agent stash/restore cycles corrupt parallel work. Run fixes manually
# before staging. See AGENTS.md "Commit Workflow" for the full rationale.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--no-fix]
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
